<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verificación de Edad</title>
  <meta name="description" content="Por favor confirma que tienes más de 18 años">
  <meta name="robots" content="noindex, nofollow">
  <meta property="og:title" content="Verificación de Edad">
  <meta property="og:description" content="Confirma tu edad para continuar">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      width: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      padding: 20px;
    }
    .age-gate {
      background: rgba(255, 255, 255, 0.95);
      padding: 32px 24px;
      border-radius: 16px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }
    .age-gate h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }
    .age-gate p {
      font-size: 15px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-confirm {
      display: block;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #e94560 0%, #0f3460 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-confirm:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(233, 69, 96, 0.4);
    }
    .btn-confirm:active {
      transform: translateY(0);
    }
    .or-have {
      margin-top: 16px;
      font-size: 13px;
      color: #9ca3af;
    }
    .btn-disabled {
      opacity: 0.6;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="age-gate">
    <h1>Verificación de Edad</h1>
    <p>
      Por favor confirma que tienes <strong>más de 18 años</strong>
      para continuar
    </p>
    <p style="font-size:13px;color:#9ca3af;margin-top:-16px;margin-bottom:20px">
      Se abrira en tu navegador
    </p>
    <button class="btn-confirm" id="confirmAge" onclick="confirmAge()">
      Tengo +18 años
    </button>
    <p class="or-have" id="orHave">© 2024 - cumtalkto.me</p>
  </div>

  <script>
    /**
     * Confirmar edad y salir al navegador del telefono.
     *
     * Dentro de Instagram se le pide a la propia app que abra la direccion
     * fuera, con su esquema `instagram://extbrowser/`. Es mas fiable que
     * adivinar el sistema operativo: se lo pides a quien tiene el webview.
     *
     * Lo que se manda fuera es YA el paso intermedio (?go=1), no esta misma
     * pagina. Si se mandara esta, al abrirse en el navegador volveria a pedir
     * la edad y habria que confirmarla dos veces.
     *
     * Saber si funciono no se puede preguntar, asi que se mira de lado: si el
     * salto ocurre, esta pestana pasa a segundo plano. Si a los 2 segundos
     * seguimos a la vista, es que la app lo bloqueo y se continua aqui mismo
     * para que nadie se quede en una pantalla muerta.
     *
     * Esto solo decide COMO se abre el siguiente paso. El contenido es el
     * mismo para todo el mundo.
     */
    function confirmAge() {
      var btn = document.getElementById('confirmAge');
      btn.className = 'btn-confirm btn-disabled';
      btn.textContent = 'Abriendo…';

      var paso2 = window.location.origin + window.location.pathname + '?go=1';
      var dentroDeInstagram = /Instagram/i.test(navigator.userAgent || '');

      if (!dentroDeInstagram) {
        window.location.replace(paso2);
        return;
      }

      var salio = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) salio = true;
      });
      window.addEventListener('pagehide', function () { salio = true; });

      window.location.href = 'instagram://extbrowser/?url=' + encodeURIComponent(paso2);

      setTimeout(function () {
        if (!salio) window.location.replace(paso2);
      }, 2000);
    }
  </script>
</body>
</html>
