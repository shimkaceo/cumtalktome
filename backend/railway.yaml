services:
  - name: biolink-api
    build:
      builder: NIXPACKS
      buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
      startCommand: npm start
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3000"
      - name: DATABASE_URL
        fromDatabase:
          name: biolink-db
          property: connectionString
      - name: REDIS_URL
        fromService:
          name: biolink-redis
          property: connectionString
      - name: JWT_SECRET
        generate: true
      - name: CLUSTER_MODE
        value: "true"
    healthcheck:
      path: /health
      interval: 10s
      timeout: 5s
      retries: 3

databases:
  - name: biolink-db
    type: postgresql
    version: "15"

  - name: biolink-redis
    type: redis
    version: "7"
